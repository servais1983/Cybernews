name: Digest quotidien CyberNews

on:
  schedule:
    # Tous les jours à 06h00 UTC (08h00 Paris en été, 07h00 en hiver)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Fenêtre de récupération (jours)"
        default: "1"
      dry_run:
        description: "Générer le digest sans envoyer d'email"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer, enrichir et diffuser le digest
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS_INCLUDE: ${{ vars.KEYWORDS_INCLUDE }}
          KEYWORDS_EXCLUDE: ${{ vars.KEYWORDS_EXCLUDE }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python cybersec_rss_feed_enhanced.py \
            --pages \
            --days "${{ github.event.inputs.days || '1' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Committer l'historique et les pages
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: digest du $(date -u +%Y-%m-%d) (historique + pages)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Publier le digest en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            digest.html
            latest_articles.json
          retention-days: 14
